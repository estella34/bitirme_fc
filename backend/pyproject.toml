[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "depogoz"
version = "0.1.0"
description = "DepoGöz — dikey kameralı depo envanter robotu: arka uç (API, kod okuma, envanter mutabakatı)"
readme = "README.md"
# Jetson (JetPack 6.2.1) Python 3.10 ile geliyor; kod 3.10 ile uyumlu tutulmalı.
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "pillow>=10.3",
    "numpy>=1.24",
    "zxing-cpp>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
depogoz = "envanter.cli:main"

[tool.setuptools.packages.find]
include = ["envanter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "DTZ"]
# E501: satır uzunluğunu formatlayıcı yönetir; kalan uzun satırlar metin/yorum.
# RUF001-003: Türkçe metinlerdeki × – … gibi karakterler bilinçli.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# FastAPI bağımlılık enjeksiyonu varsayılan argümanda Depends()/File() kullanır.
"envanter/api/*" = ["B008"]
