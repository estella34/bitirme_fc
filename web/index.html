<!doctype html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="DepoGöz: depo envanter robotu için canlı dijital ikiz, raf gözü mutabakatı ve inceleme kuyruğu." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101a27'/%3E%3Cpath d='M6 4v24M26 4v24' stroke='%232f6be4' stroke-width='2.8' fill='none'/%3E%3Cpath d='M6 8.5h20M6 23.5h20' stroke='%23f2791c' stroke-width='2.8' fill='none'/%3E%3Cpath d='M9.5 16c2.8-4 10.2-4 13 0-2.8 4-10.2 4-13 0z' stroke='%23e4ecf5' stroke-width='1.7' fill='none' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='16' r='2.3' fill='%23f2791c'/%3E%3C/svg%3E" />
    <title>DepoGöz</title>
    <script>
      // Temayı ilk boyamadan önce ayarla (yanıp sönmesin): kayıtlı tercih, yoksa sistem.
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("depogoz-tema");
        } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
